[project]
name = "umkm-operational-backend"
version = "0.1.0"
description = "REST API for UMKM operational and financial management"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "itsdangerous>=2.2.0",
    "bcrypt>=4.1.3",
    "pydantic-settings>=2.6.0",
    "pymysql>=1.1.1",
    "sqlmodel>=0.0.22",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = "src"

[tool.fastapi]
entrypoint = "app.main:app"
